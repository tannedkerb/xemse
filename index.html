<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XƏMSƏ — Experience Azerbaijan</title>
  <meta name="description" content="XƏMSƏ — beş binadan ibarət turizm kompleksi: Nar Otel, Buta Arena, Şah Plov, Xarıbülbül və Azərbaycan Muzeyi." />
  <link rel="icon" href="img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="is-loading">

  <!-- ===== PRELOADER ===== -->
  <!-- Заставка (плоский 2D в цветах логотипа): гранат падает с толстой ветки →
       меч снизу делает полуоборот 180° слева направо и разрубает его → внутри узор логотипа → вырастают лепестки -->
  <div class="preloader" id="preloader" aria-hidden="true">
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <!-- целый гранат: плоские заливки, тёмно-синий контур, золотая внутренняя линия как на лого -->
        <symbol id="nar" viewBox="0 0 511 483">
          <g stroke="#0b3550" stroke-width="10" stroke-linejoin="round">
            <path d="M214 124 L206 30 L238 70 L259 6 L280 70 L312 30 L304 124 Z" fill="#c0262b"/>
            <circle cx="259" cy="250" r="140" fill="#c0262b"/>
          </g>
          <path d="M226 112 L222 58 L242 84 L259 36 L276 84 L296 58 L292 112" fill="none" stroke="#f0b43a" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="259" cy="250" r="116" fill="none" stroke="#f0b43a" stroke-width="10"/>
          <path d="M180 200 C 190 165, 215 145, 245 140" fill="none" stroke="#e8892a" stroke-width="12" stroke-linecap="round"/>
          <path d="M300 330 C 322 316, 338 296, 344 272" fill="none" stroke="#8e1a1f" stroke-width="10" stroke-linecap="round" opacity=".55"/>
        </symbol>
        <!-- лист в стиле лепестков логотипа -->
        <symbol id="leaf" viewBox="-4 -26 108 52">
          <path d="M0 0 C 25 -24, 70 -24, 100 0 C 70 24, 25 24, 0 0 Z" fill="currentColor" stroke="#0b3550" stroke-width="5" stroke-linejoin="round"/>
          <path d="M10 0 C 40 -6, 65 -6, 88 0" fill="none" stroke="#f0b43a" stroke-width="4" stroke-linecap="round"/>
        </symbol>
      </defs>
    </svg>

    <div class="pl-stage" id="plStage">
      <svg class="pl-branch" viewBox="0 0 600 170" aria-hidden="true">
        <!-- толстая ветка: тёмно-синий контур + коричневая заливка + золотая прожилка -->
        <g fill="none" stroke-linecap="round">
          <path d="M-20 78 C 110 40, 220 104, 330 66 S 520 28, 620 62" stroke="#0b3550" stroke-width="58"/>
          <path d="M300 74 C 304 96, 300 112, 300 132" stroke="#0b3550" stroke-width="28"/>
          <path d="M-20 78 C 110 40, 220 104, 330 66 S 520 28, 620 62" stroke="#8a4b22" stroke-width="44"/>
          <path d="M300 74 C 304 96, 300 112, 300 132" stroke="#8a4b22" stroke-width="16"/>
          <path d="M20 62 C 120 34, 210 88, 300 62" stroke="#b86b2e" stroke-width="9" opacity=".9"/>
          <path d="M360 52 C 430 36, 500 30, 580 46" stroke="#b86b2e" stroke-width="7" opacity=".8"/>
        </g>
        <use href="#leaf" x="40" y="6" width="96" height="46" style="color:#3a8a3a" transform="rotate(-18 88 30)"/>
        <use href="#leaf" x="140" y="92" width="100" height="48" style="color:#126470"/>
        <use href="#leaf" x="210" y="10" width="88" height="42" style="color:#3a8a3a"/>
        <use href="#leaf" x="360" y="84" width="100" height="48" style="color:#4bb3c8"/>
        <use href="#leaf" x="420" y="0" width="96" height="46" style="color:#3a8a3a"/>
        <use href="#leaf" x="500" y="70" width="92" height="44" style="color:#126470"/>
      </svg>

      <div class="pl-logo">
        <img src="img/petal-1.png" alt="" class="pl-petal" style="--i:0;--r:-30deg" />
        <img src="img/petal-2.png" alt="" class="pl-petal" style="--i:1;--r:25deg" />
        <img src="img/petal-3.png" alt="" class="pl-petal" style="--i:2;--r:-20deg" />
        <img src="img/petal-4.png" alt="" class="pl-petal" style="--i:3;--r:20deg" />
        <img src="img/petal-5.png" alt="" class="pl-petal" style="--i:4;--r:-25deg" />
        <img src="img/petal-6.png" alt="" class="pl-petal" style="--i:5;--r:30deg" />
        <img src="img/emblem-center.png" alt="" class="pl-center" />

        <div class="pl-seeds">
          <i style="--x:-140px;--y:-60px"></i><i style="--x:150px;--y:-40px"></i><i style="--x:-110px;--y:90px"></i>
          <i style="--x:120px;--y:110px"></i><i style="--x:-40px;--y:-130px"></i><i style="--x:60px;--y:-120px"></i>
          <i style="--x:-170px;--y:20px"></i><i style="--x:175px;--y:40px"></i><i style="--x:-70px;--y:140px"></i>
          <i style="--x:80px;--y:150px"></i><i style="--x:-150px;--y:-110px"></i><i style="--x:160px;--y:-100px"></i>
        </div>

        <div class="pl-half pl-half--l"><svg><use href="#nar"/></svg></div>
        <div class="pl-half pl-half--r"><svg><use href="#nar"/></svg></div>
        <div class="pl-fruit"><svg><use href="#nar"/></svg></div>

        <!-- след меча: полукруг 180° -->
        <svg class="pl-arc" viewBox="-100 -100 200 100" aria-hidden="true">
          <path d="M-94 0 A94 94 0 0 1 94 0" fill="none" stroke="#f0b43a" stroke-width="7" stroke-linecap="round"/>
        </svg>
        <div class="pl-slash"></div>
        <!-- тюркская сабля (кылыч): изогнутый клинок с елманью у острия, крестовина с шариками,
             рукоять с загнутым навершием. Центр вращения — середина рукояти. -->
        <svg class="pl-sword" viewBox="0 0 64 420" aria-hidden="true">
          <g stroke="#0b3550" stroke-width="5" stroke-linejoin="round">
            <path d="M25 316 C 23 232, 26 148, 38 84 C 42 60, 47 34, 55 6 C 60 22, 61 40, 57 56 L 51 66 C 44 128, 39 214, 39 316 Z" fill="#eef3f6"/>
            <path d="M31 300 C 30 226, 32 156, 42 88" fill="none" stroke="#9cc7d6" stroke-width="3.5" stroke-linecap="round"/>
            <rect x="9" y="313" width="46" height="11" rx="5.5" fill="#f0b43a"/>
            <circle cx="9" cy="318.5" r="7" fill="#f0b43a"/>
            <circle cx="55" cy="318.5" r="7" fill="#f0b43a"/>
            <path d="M25 324 L39 324 C 39 348, 38 366, 34 384 L 22 384 C 25 366, 25 348, 25 324 Z" fill="#c0262b"/>
            <path d="M22 384 L34 384 C 33 398, 24 408, 10 405 C 6 398, 11 389, 22 384 Z" fill="#f0b43a"/>
          </g>
          <path d="M27 338 L37 344 M26 354 L37 360 M25 370 L36 376" stroke="#f0b43a" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div class="preloader__word" aria-label="XƏMSƏ">
      <span style="--i:0">X</span><span style="--i:1">Ə</span><span style="--i:2">M</span><span style="--i:3">S</span><span style="--i:4">Ə</span>
    </div>
    <div class="preloader__sub">Experience Azerbaijan</div>
    <div class="pl-flash"></div>
  </div>

  <div class="scroll-progress" id="scrollProgress"></div>

  <!-- ===== HEADER ===== -->
  <header class="header" id="header">
    <div class="container header__row">
      <a href="#home" class="brand">
        <img src="img/emblem.png" alt="XƏMSƏ" class="brand__logo" />
        <span class="brand__text">
          <span class="brand__name">XƏMSƏ</span>
          <span class="brand__tag">Experience Azerbaijan</span>
        </span>
      </a>
      <nav class="nav" id="nav">
        <a href="#about" data-i18n="nav.about"></a>
        <a href="#complex" data-i18n="nav.complex"></a>
        <a href="#rooms" data-i18n="nav.rooms"></a>
        <a href="#restaurant" data-i18n="nav.restaurant"></a>
        <a href="#services" data-i18n="nav.services"></a>
        <a href="#tickets" data-i18n="nav.tickets"></a>
        <a href="#gallery" data-i18n="nav.gallery"></a>
        <a href="#team" data-i18n="nav.team"></a>
        <a href="#contact" data-i18n="nav.contact"></a>
      </nav>
      <div class="header__actions">
        <div class="lang" id="lang">
          <button data-lang="az">AZ</button>
          <button data-lang="ru">RU</button>
          <button data-lang="en">EN</button>
        </div>
        <button class="btn btn--gold btn--sm js-book" data-i18n="btn.book"></button>
        <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <!-- ===== HERO ===== -->
  <section class="hero" id="home">
    <div class="hero__bg" id="heroBg">
      <img src="img/hotel.jpg" alt="" class="active" />
      <img src="img/entertainment.jpg" alt="" />
      <img src="img/sport.jpg" alt="" />
      <img src="img/restaurant.jpg" alt="" />
      <img src="img/museum.jpg" alt="" />
    </div>
    <div class="hero__shade"></div>
    <canvas class="hero__seeds" id="seeds"></canvas>
    <div class="container hero__content">
      <p class="kicker hero__kicker" data-i18n="hero.kicker"></p>
      <h1 class="hero__title" id="heroTitle" aria-label="XƏMSƏ">XƏMSƏ</h1>
      <p class="hero__sub" data-i18n="hero.sub"></p>
      <div class="hero__cta">
        <a href="#complex" class="btn btn--outline" data-i18n="btn.explore"></a>
        <button class="btn btn--gold js-book" data-i18n="btn.book"></button>
      </div>
    </div>

    <form class="quick container" id="quickForm">
      <label class="quick__field"><span data-i18n="q.checkin"></span><input type="date" id="qIn" required /></label>
      <label class="quick__field"><span data-i18n="q.checkout"></span><input type="date" id="qOut" required /></label>
      <label class="quick__field"><span data-i18n="q.guests"></span>
        <select id="qGuests"><option>1</option><option selected>2</option><option>3</option><option>4</option></select>
      </label>
      <button class="btn btn--gold" type="submit" data-i18n="q.find"></button>
    </form>

    <a href="#about" class="hero__scroll"><span data-i18n="hero.scroll"></span><i></i></a>
  </section>

  <!-- ===== ABOUT ===== -->
  <section class="section about" id="about">
    <div class="ornament ornament--left"></div>
    <div class="container about__grid">
      <div class="about__media reveal">
        <div class="about__frame">
          <img src="img/hotel.jpg" alt="XƏMSƏ" style="object-position:66% 50%" />
        </div>
        <img src="img/emblem.png" alt="" class="about__badge" />
      </div>
      <div class="about__text">
        <p class="kicker reveal" data-i18n="about.kicker"></p>
        <h2 class="title reveal" data-i18n="about.title"></h2>
        <p class="lead reveal" data-i18n="about.p1"></p>
        <p class="reveal" data-i18n="about.p2"></p>
        <div class="stats reveal">
          <div class="stat"><b data-count="5">0</b><span data-i18n="stat.buildings"></span></div>
          <div class="stat"><b data-count="240">0</b><span data-i18n="stat.rooms"></span></div>
          <div class="stat"><b data-count="8">0</b><span data-i18n="stat.floors"></span></div>
          <div class="stat"><b data-count="5">0</b><span data-i18n="stat.team"></span></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== COMPLEX: 5 BUILDINGS ===== -->
  <section class="section complex" id="complex">
    <div class="container">
      <div class="section__head">
        <p class="kicker reveal" data-i18n="complex.kicker"></p>
        <h2 class="title reveal" data-i18n="complex.title"></h2>
      </div>
      <div class="showcase reveal" id="showcase">
        <ol class="showcase__list" id="showcaseList"></ol>
        <div class="showcase__stage" id="showcaseStage"></div>
      </div>
    </div>
  </section>

  <!-- ===== ROOMS ===== -->
  <section class="section rooms" id="rooms">
    <div class="container rooms__grid">
      <div class="rooms__aside reveal">
        <div class="rooms__photo"><img src="img/hotel.jpg" alt="Nar Otel" /></div>
      </div>
      <div class="rooms__main">
        <p class="kicker reveal" data-i18n="rooms.kicker"></p>
        <h2 class="title reveal" data-i18n="rooms.title"></h2>

        <div class="room-list" id="roomList"></div>

    </div>

      </div>
      <div class="rest__media reveal">

      </div>

        <h2 class="title reveal" data-i18n="serv.title"></h2>

      <div class="serv-grid">
        <div class="serv reveal"><div class="serv__ico">🧖</div><h4 data-i18n="s.spa"></h4><p data-i18n="s.spa.d"></p></div>
        <div class="serv reveal"><div class="serv__ico">🏊</div><h4 data-i18n="s.pool"></h4><p data-i18n="s.pool.d"></p></div>
        <div class="serv reveal"><div class="serv__ico">🍽️</div><h4 data-i18n="s.rest"></h4><p data-i18n="s.rest.d"></p></div>
        <div class="serv reveal"><div class="serv__ico">🎤</div><h4 data-i18n="s.conf"></h4><p data-i18n="s.conf.d"></p></div>
        <div class="serv reveal"><div class="serv__ico">🚘</div><h4 data-i18n="s.transfer"></h4><p data-i18n="s.transfer.d"></p></div>
        <div class="serv reveal"><div class="serv__ico">🎠</div><h4 data-i18n="s.kids"></h4><p data-i18n="s.kids.d"></p></div>

  <!-- ===== TICKETS / KHAMSA PASS ===== -->
  <section class="section tickets" id="tickets">
    <div class="container">

        <p class="kicker reveal" data-i18n="tk.kicker"></p>
        <h2 class="title reveal" data-i18n="tk.title"></h2>
        <p class="lead reveal" data-i18n="tk.sub"></p>

  <!-- ===== INVESTMENT ===== -->
  <section class="section invest" id="invest">
    <div class="container">
      <div class="section__head">
        <p class="kicker reveal" data-i18n="inv.kicker"></p>
        <h2 class="title reveal" data-i18n="inv.title"></h2>
        <p class="lead reveal" data-i18n="inv.sub"></p>

      <p class="inv__note reveal" data-i18n="inv.note"></p>

  <!-- ===== TEAM ===== -->
  <section class="section team" id="team">
    <div class="container">
      <div class="section__head">
        <p class="kicker reveal" data-i18n="team.kicker"></p>

        <p class="lead reveal" data-i18n="team.sub"></p>

      <div class="team-grid" id="teamGrid"></div>

    <div class="container faq__wrap">
      <div class="section__head">
        <p class="kicker reveal" data-i18n="faq.kicker"></p>
        <h2 class="title reveal" data-i18n="faq.title"></h2>
      </div>
      <div class="accordion" id="faqList"></div>
    </div>
  </section>

  <!-- ===== CONTACT ===== -->
  <section class="section contact" id="contact">
    <div class="container contact__grid">
      <div class="contact__info">
        <p class="kicker reveal" data-i18n="contact.kicker"></p>

      <div class="contact__map reveal">
        <iframe id="map" title="map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

  <!-- ===== FOOTER ===== -->

    <div class="container footer__row">
      <div class="footer__brand">
        <img src="img/emblem.png" alt="" />

          <p data-i18n="footer.text"></p>
        </div>
      </div>
      <p class="footer__copy">© <span id="year"></span> XƏMSƏ. <span data-i18n="footer.rights"></span></p>
    </div>
  </footer>

  </a>
  <button class="to-top" id="toTop" aria-label="Top">↑</button>

  <!-- ===== BUILDING MODAL ===== -->
  <div class="modal" id="bModal" aria-hidden="true">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__box modal__box--wide">
      <button class="modal__close" data-close aria-label="Close">×</button>
      <div class="bmodal" id="bModalBody"></div>
    </div>
  </div>

  <!-- ===== BOOKING MODAL ===== -->
  <div class="modal" id="bookModal" aria-hidden="true">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__box">
      <button class="modal__close" data-close aria-label="Close">×</button>
      <div class="bk" id="bkForm">
        <img src="img/emblem.png" alt="" class="bk__logo" />
        <h3 class="bk__title" data-i18n="bk.title"></h3>
        <form id="bookForm" novalidate>
          <label class="f f--full"><span data-i18n="bk.room"></span><select id="bRoom"></select></label>
          <label class="f"><span data-i18n="q.checkin"></span><input type="date" id="bIn" required /></label>
          <label class="f"><span data-i18n="q.checkout"></span><input type="date" id="bOut" required /></label>
          <label class="f"><span data-i18n="bk.adults"></span><input type="number" id="bAdults" min="1" max="6" value="2" /></label>
          <label class="f"><span data-i18n="bk.kids"></span><input type="number" id="bKids" min="0" max="4" value="0" /></label>
          <label class="f f--full"><span data-i18n="bk.name"></span><input type="text" id="bName" required /></label>
          <label class="f"><span data-i18n="bk.phone"></span><input type="tel" id="bPhone" placeholder="+994" required /></label>
          <label class="f"><span data-i18n="bk.email"></span><input type="email" id="bEmail" /></label>
          <label class="f f--full"><span data-i18n="bk.comment"></span><textarea id="bComment" rows="2"></textarea></label>
          <label class="check f--full"><input type="checkbox" id="bTransfer" /><i></i><span data-i18n="bk.transfer"></span></label>
          <div class="bk__sum f--full">
            <div><span data-i18n="bk.nights"></span><b id="sNights">0</b></div>
            <div><span data-i18n="bk.total"></span><b id="sTotal">0 AZN</b></div>
          </div>
          <p class="bk__err f--full" id="bErr"></p>
          <button class="btn btn--gold f--full" type="submit" data-i18n="bk.submit"></button>
        </form>
      </div>
      <div class="ok" id="bkOk" hidden>
        <div class="ok__icon"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-16"/></svg></div>
        <h3 data-i18n="ok.title"></h3>
        <p data-i18n="ok.text"></p>
        <p class="ok__num"><span data-i18n="ok.num"></span>: <b id="okNum"></b></p>
        <button class="btn btn--gold" data-close data-i18n="ok.close"></button>
      </div>
    </div>
  </div>

  <!-- ===== LIGHTBOX ===== -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox__close" aria-label="Close">×</button>
    <button class="lightbox__nav lightbox__prev" aria-label="Prev">‹</button>
    <img alt="" id="lbImg" />
    <button class="lightbox__nav lightbox__next" aria-label="Next">›</button>
  </div>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
